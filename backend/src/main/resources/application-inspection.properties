# Opt-in local integration profile; no modification of existing database credentials.
server.address=127.0.0.1
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
spring.servlet.multipart.file-size-threshold=0
zhijian.inspection.ai-base-url=${AI_SERVICE_BASE_URL:http://127.0.0.1:8001}
zhijian.inspection.storage-root=${INSPECTION_STORAGE_ROOT:./var/inspection-artifacts}
